name: Daily

# ENTSO-E month files (last 35 days refreshed, history back to 2024-01 filled in),
# installed capacity, dataset card, health check. Fails at most once a day if
# the recorder or the weather backfill went silent.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m dpf daily --max-seconds 1800
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
