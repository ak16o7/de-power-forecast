name: Weather backfill

# Hourly until the archive is complete: previous-runs vintages since 2024-01,
# then every archived model run. Own daily Open-Meteo cap (8,000 of 10,000
# calls), resumes where the last run stopped. Once complete it only picks up
# the odd run the recorder missed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m dpf weather-backfill --max-seconds 3000
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
