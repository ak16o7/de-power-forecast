name: Model

# Day-ahead and intraday models: walk-forward backtests over the last 12 complete
# months, scored against the TSO forecasts. Weekly; results in reports/ on HF.
on:
  schedule:
    - cron: "29 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-model.txt
      - run: python -m dpf backtest-da
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: python -m dpf backtest-id
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
